name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Scan tracked files for secret-shaped values
        run: |
          ! git grep -En '(CLOUDFLARE_API_TOKEN|GITHUB_TOKEN|OPENROUTER_API_KEY)=[^$[:space:]]+' -- ':!package-lock.json'
