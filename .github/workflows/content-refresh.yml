name: Current content publisher

on:
  workflow_dispatch:
    inputs:
      expanded_sources:
        description: 'Supervised run of the guarded 33-endpoint ingestion path'
        required: false
        default: false
        type: boolean
      publish_expanded:
        description: 'Explicit second-stage approval to let expanded candidates reach the writer'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  EXPANDED_INGESTION: ${{ (github.event_name == 'workflow_dispatch' && inputs.expanded_sources) || vars.EXPANDED_INGESTION_ENABLED == 'true' }}
  EXPANDED_PUBLICATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.expanded_sources && inputs.publish_expanded) || (vars.EXPANDED_INGESTION_ENABLED == 'true' && vars.EXPANDED_PUBLICATION_ENABLED == 'true') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Validate the expanded endpoint configuration
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run content:config-validate

      - name: Fetch prior endpoint health for safe backoff
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run source-health:fetch:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fetch 33 configured endpoints
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run content:ingest:expanded
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Classify broad and community candidates
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run content:classify
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_CLASSIFIER_MODEL: ${{ vars.OPENROUTER_CLASSIFIER_MODEL || 'openai/gpt-4.1-mini' }}

      - name: Fail closed on expanded ingestion acceptance
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run content:ingest:accept

      - name: Atomically sync exact endpoint health
        if: env.EXPANDED_INGESTION == 'true'
        run: npm run source-health:sync:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Produce sanitized expanded-run evidence
        if: env.EXPANDED_INGESTION == 'true'
        run: node scripts/summarize-expanded-ingestion.mjs

      - name: Upload sanitized expanded-run evidence
        if: env.EXPANDED_INGESTION == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: expanded-ingestion-evidence-${{ github.run_id }}
          path: content/drafts/expanded-run-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Fetch current five-feed records while expansion is disabled
        if: env.EXPANDED_INGESTION != 'true'
        run: npm run content:ingest

      - name: Count genuinely unseen candidates
        if: env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true'
        id: candidates
        shell: bash
        run: |
          count="$(node -e "const x=require('./content/drafts/ingested.json'); process.stdout.write(String(x.candidates?.length ?? 0))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ge 1 ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Generate bilingual current content
        if: steps.candidates.outputs.publish == 'true' && (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        run: npm run content:generate-current
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-4' }}

      - name: Reject non-incremental, duplicate, unsupported, or unnatural output
        if: steps.candidates.outputs.publish == 'true' && (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        run: npm run content:verify-incremental
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'anthropic/claude-sonnet-4' }}
          OPENROUTER_REVIEW_MODEL: ${{ vars.OPENROUTER_REVIEW_MODEL || 'openai/gpt-4.1' }}

      - name: Run reproducible publication gates
        if: steps.candidates.outputs.publish == 'true' && (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        run: |
          npm run content:validate
          npm run content:editorial-validate
          npm run content:links
          npm run insight:daily-check
          npm test
          npm run build

      - name: Audit generated diff
        if: steps.candidates.outputs.publish == 'true' && (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        id: diff
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          unexpected="$(printf '%s\n' "$status" | sed -E 's/^.. //' | grep -Ev '^(content/feed\.json|content/insights\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --quiet -- content/feed.json content/insights.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Model selected no genuinely new records; safe no-op."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and rebase the validated bundle
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "agi-times-publisher[bot]"
          git config user.email "agi-times-publisher[bot]@users.noreply.github.com"
          git add content/feed.json content/insights.json
          git diff --cached --name-only
          git commit -m "content: publish current bilingual update $(date -u +%Y-%m-%dT%H:%MZ)"
          git fetch origin main
          git rebase origin/main
          npm run content:validate
          npm run content:editorial-validate
          npm run insight:daily-check

      - name: Push validated bundle
        if: steps.diff.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Deploy the exact rebased checkout before D1 mutation
        if: steps.diff.outputs.changed == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed UI contains the exact bundle before D1 mutation
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/verify-production-content.mjs --static

      - name: Apply exact deployed bundle to D1
        if: steps.diff.outputs.changed == 'true'
        run: npm run content:sync:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify UI and API expose matching content IDs
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/verify-production-content.mjs

      - name: Verify existing daily Insight on a no-op run
        if: steps.candidates.outputs.publish != 'true' && (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        run: |
          npm run content:validate
          npm run content:editorial-validate
          npm run insight:daily-check

      - name: Production health check
        if: (env.EXPANDED_INGESTION != 'true' || env.EXPANDED_PUBLICATION == 'true')
        run: curl --fail --retry 5 --retry-delay 5 https://agitime.ai/api/v1/health
